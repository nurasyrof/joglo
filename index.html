<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rumahadat.id · Traditional houses of Indonesia</title>
  <meta name="description" content="Explore Indonesia's traditional houses in 3D: take them apart, cut through them and learn what every part means." />
  <link rel="canonical" href="https://rumahadat.id/" />
  <meta property="og:site_name" content="rumahadat.id" />
  <meta property="og:title" content="rumahadat.id · Traditional houses of Indonesia" />
  <meta property="og:description" content="Explore Indonesia's traditional houses in 3D: take them apart, cut through them and learn what every part means." />
  <meta property="og:url" content="https://rumahadat.id/" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)" />
  <script>
    // Apply the saved theme before first paint (light is the default).
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
    // Language: saved choice, else the browser's (same rule as src/ui/lang.jsx).
    try {
      var l = localStorage.getItem('lang');
      if (l !== 'en' && l !== 'id') l = (navigator.languages || [navigator.language || 'en']).some(function (x) { return /^(id|ms)\b/i.test(x); }) ? 'id' : 'en';
      document.documentElement.lang = l;
    } catch (e) {}
  </script>
  <style>
    /* Shown until the app's own loading screen takes over; matches its look. */
    html { background: #faf8f5; }
    html.dark { background: #1c1814; }
    .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; }
    .boot svg { width: 28px; height: 28px; color: #a5532f; animation: boot-spin 1s linear infinite; }
    .boot p { margin: 0; font: italic 18px/1.4 'Cormorant Garamond', Georgia, serif; color: #8a7f74; }
    html.dark .boot svg { color: #e0b25a; }
    html.dark .boot p { color: #a39888; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <p>Loading…</p>
      <script>if (document.documentElement.lang === 'id') document.currentScript.previousElementSibling.textContent = 'Memuat…';</script>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
